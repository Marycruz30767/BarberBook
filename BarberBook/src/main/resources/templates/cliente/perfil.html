<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- Cambio de idioma -->
    <div class="text-end mb-3">

        <a th:href="@{/usuario/perfil(lang='es')}"
           class="btn btn-outline-secondary btn-sm">
            Español
        </a>

        <a th:href="@{/usuario/perfil(lang='en')}"
           class="btn btn-outline-secondary btn-sm">
            English
        </a>

    </div>

    <div class="card mx-auto" style="max-width: 600px;">

        <div class="card-header bg-dark text-white">

            <h4 th:text="#{perfil.titulo}">
                Mi perfil
            </h4>

        </div>

        <div class="card-body">

            <!-- Mensaje de guardado exitoso -->
            <div th:if="${mensaje}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <span th:text="${mensaje}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>

            </div>

            <form th:action="@{/usuario/guardar}"
                  th:object="${usuario}"
                  method="post">

                <input type="hidden"
                       th:field="*{idUsuario}">

                <!-- Nombre -->
                <div class="mb-3">

                    <label th:text="#{perfil.nombre}">
                        Nombre
                    </label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           required>

                </div>

                <!-- Apellido -->
                <div class="mb-3">

                    <label th:text="#{perfil.apellido}">
                        Apellido
                    </label>

                    <input type="text"
                           th:field="*{apellido}"
                           class="form-control"
                           required>

                </div>

                <!-- Correo -->
                <div class="mb-3">

                    <label th:text="#{perfil.correo}">
                        Correo electrónico
                    </label>

                    <input type="email"
                           th:field="*{correo}"
                           class="form-control"
                           required>

                </div>

                <!-- Teléfono -->
                <div class="mb-3">

                    <label th:text="#{perfil.telefono}">
                        Teléfono
                    </label>

                    <input type="text"
                           th:field="*{telefono}"
                           class="form-control">

                </div>

                <!-- Botones -->
                <button type="submit"
                        class="btn btn-dark"
                        th:text="#{perfil.guardar}">
                    Guardar cambios
                </button>

                <a th:href="@{/servicio/listado}"
                   class="btn btn-secondary"
                   th:text="#{boton.regresar}">
                    Regresar
                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
