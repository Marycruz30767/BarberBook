<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- Cambio de idioma -->
    <div class="text-end mb-3">

        <a th:href="@{/reserva/mis-reservas(lang='es')}"
           class="btn btn-outline-secondary btn-sm">
            Español
        </a>

        <a th:href="@{/reserva/mis-reservas(lang='en')}"
           class="btn btn-outline-secondary btn-sm">
            English
        </a>

    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 th:text="#{reservas.titulo}">
            Mis reservas
        </h2>

        <a th:href="@{/servicio/listado}"
           class="btn btn-dark"
           th:text="#{reservas.volver}">
            Volver a servicios
        </a>

    </div>

    <!-- Si no existen reservas -->
    <div th:if="${#lists.isEmpty(reservas)}"
         class="alert alert-info"
         th:text="#{reservas.vacio}">
        No tienes reservas registradas.
    </div>

    <!-- Tabla de reservas -->
    <table th:if="${!#lists.isEmpty(reservas)}"
           class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th th:text="#{reservas.fecha}">Fecha</th>
            <th th:text="#{reservas.hora}">Hora</th>
            <th th:text="#{reservas.servicio}">Servicio</th>
            <th th:text="#{reservas.barbero}">Barbero</th>
            <th th:text="#{reservas.estado}">Estado</th>
            <th th:text="#{reservas.acciones}">Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="reserva : ${reservas}">

            <td th:text="${reserva.fecha}"></td>

            <td th:text="${reserva.hora}"></td>

            <td th:text="${reserva.servicio.nombre}"></td>

            <td th:text="${reserva.empleado.usuario.nombre}"></td>

            <td th:text="${reserva.estado}"></td>

            <td>

                <a th:if="${reserva.estado != 'Cancelada'}"
                   th:href="@{/reserva/cancelar/}+${reserva.idReserva}"
                   class="btn btn-danger btn-sm"
                   th:text="#{reservas.cancelar}">
                    Cancelar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
