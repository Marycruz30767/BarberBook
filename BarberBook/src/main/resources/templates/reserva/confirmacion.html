<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- Cambio de idioma -->
    <div class="text-end mb-3">

        <a th:href="@{/reserva/confirmacion/{id}(id=${reserva.idReserva},lang='es')}"
           class="btn btn-outline-secondary btn-sm">
            Español
        </a>

        <a th:href="@{/reserva/confirmacion/{id}(id=${reserva.idReserva},lang='en')}"
           class="btn btn-outline-secondary btn-sm">
            English
        </a>

    </div>

    <div class="card mx-auto" style="max-width: 650px;">

        <div class="card-header bg-success text-white text-center">

            <h4 th:text="#{confirmacion.titulo}">
                Reserva confirmada
            </h4>

        </div>

        <div class="card-body">

            <!-- Cliente -->
            <p>
                <strong th:text="#{confirmacion.cliente}">
                    Cliente
                </strong>:

                <span th:text="${reserva.usuario.nombre + ' ' + reserva.usuario.apellido}">
                </span>
            </p>

            <!-- Servicio -->
            <p>
                <strong th:text="#{confirmacion.servicio}">
                    Servicio
                </strong>:

                <span th:text="${reserva.servicio.nombre}">
                </span>
            </p>

            <!-- Fecha -->
            <p>
                <strong th:text="#{confirmacion.fecha}">
                    Fecha
                </strong>:

                <span th:text="${reserva.fecha}">
                </span>
            </p>

            <!-- Hora -->
            <p>
                <strong th:text="#{confirmacion.hora}">
                    Hora
                </strong>:

                <span th:text="${reserva.hora}">
                </span>
            </p>

            <!-- Barbero -->
            <p>
                <strong th:text="#{confirmacion.barbero}">
                    Barbero
                </strong>:

                <span th:text="${reserva.empleado.usuario.nombre}">
                </span>
            </p>

            <!-- Estado -->
            <p>
                <strong th:text="#{confirmacion.estado}">
                    Estado
                </strong>:

                <span th:text="${reserva.estado}">
                </span>
            </p>

            <!-- Botones -->
            <div class="text-center mt-4">

                <a th:href="@{/servicio/listado}"
                   class="btn btn-dark"
                   th:text="#{confirmacion.volver}">
                    Volver a servicios
                </a>

                <a th:href="@{/reserva/nueva}"
                   class="btn btn-outline-dark"
                   th:text="#{confirmacion.otra}">
                    Hacer otra reserva
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
