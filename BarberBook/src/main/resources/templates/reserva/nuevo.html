<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="text-end mb-3">
        <a th:href="@{/reserva/nueva(lang='es')}" class="btn btn-outline-secondary btn-sm">Español</a>
        <a th:href="@{/reserva/nueva(lang='en')}" class="btn btn-outline-secondary btn-sm">English</a>
    </div>

    <div class="card mx-auto" style="max-width: 700px;">

        <div class="card-header bg-dark text-white">
            <h4 th:text="#{reserva.titulo}">
                Reservar cita
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/reserva/guardar}"
                  th:object="${reserva}"
                  method="post">

                <div class="mb-3">

                    <label th:text="#{reserva.servicio}">
                        Servicio
                    </label>

                    <select th:field="*{servicio.idServicio}"
                            class="form-select"
                            required>

                        <option value=""
                                th:text="#{reserva.seleccionarServicio}">
                            Seleccione un servicio
                        </option>

                        <option th:each="servicio : ${servicios}"
                                th:value="${servicio.idServicio}"
                                th:text="${servicio.nombre + ' - ₡' + servicio.precio}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label th:text="#{reserva.horario}">
                        Horario disponible
                    </label>

                    <select th:field="*{horario.idHorario}"
                            class="form-select"
                            required>

                        <option value=""
                                th:text="#{reserva.seleccionarHorario}">
                            Seleccione un horario
                        </option>

                        <option th:each="horario : ${horarios}"
                                th:value="${horario.idHorario}"
                                th:text="${horario.fecha + ' - ' + horario.hora + ' - ' + horario.empleado.usuario.nombre}">
                        </option>

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-dark"
                        th:text="#{reserva.confirmar}">
                    Confirmar reserva
                </button>

                <a th:href="@{/servicio/listado}"
                   class="btn btn-secondary"
                   th:text="#{boton.regresar}">
                    Regresar
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
