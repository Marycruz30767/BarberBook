<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5 text-center">

    <div class="text-end mb-4">

        <a th:href="@{/(lang='es')}"
           class="btn btn-outline-secondary btn-sm">
            Español
        </a>

        <a th:href="@{/(lang='en')}"
           class="btn btn-outline-secondary btn-sm">
            English
        </a>

    </div>

    <h1 th:text="#{inicio.titulo}">
        Bienvenido a BarberBook
    </h1>

    <p class="lead"
       th:text="#{inicio.descripcion}">
        Sistema web para la gestión de reservas en barberías.
    </p>

    <a th:href="@{/login}"
       class="btn btn-dark"
       th:text="#{inicio.login}">
        Iniciar sesión
    </a>

    <a th:href="@{/registro}"
       class="btn btn-outline-dark"
       th:text="#{inicio.registro}">
        Crear cuenta
    </a>

</div>

</body>
</html>
