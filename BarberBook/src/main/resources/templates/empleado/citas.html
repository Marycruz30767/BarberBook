<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Citas asignadas - BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Citas asignadas</h2>

    <div>
        <a th:href="@{/servicio/listado}"
           class="btn btn-secondary">
            Regresar
        </a>

        <a th:href="@{/logout}"
           class="btn btn-outline-danger">
            Cerrar sesión
        </a>
    </div>

</div>

    <div th:if="${#lists.isEmpty(reservas)}"
         class="alert alert-info">
        No existen citas asignadas.
    </div>

    <table th:if="${!#lists.isEmpty(reservas)}"
           class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Servicio</th>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Actualizar estado</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="reserva : ${reservas}">

            <td th:text="${reserva.fecha}"></td>

            <td th:text="${reserva.hora}"></td>

            <td th:text="${reserva.servicio.nombre}"></td>

            <td th:text="${reserva.usuario.nombre + ' ' + reserva.usuario.apellido}"></td>

            <td th:text="${reserva.usuario.telefono}"></td>

            <td th:text="${reserva.estado}"></td>

            <td>

                <form th:action="@{/empleado/cita/estado}"
                      method="post"
                      class="d-flex gap-2">

                    <input type="hidden"
                           name="idReserva"
                           th:value="${reserva.idReserva}">

                    <select name="estado"
                            class="form-select form-select-sm"
                            required>

                        <option value="Pendiente"
                                th:selected="${reserva.estado == 'Pendiente'}">
                            Pendiente
                        </option>

                        <option value="En proceso"
                                th:selected="${reserva.estado == 'En proceso'}">
                            En proceso
                        </option>

                        <option value="Completada"
                                th:selected="${reserva.estado == 'Completada'}">
                            Completada
                        </option>

                        <option value="Cancelada"
                                th:selected="${reserva.estado == 'Cancelada'}">
                            Cancelada
                        </option>

                    </select>

                    <button type="submit"
                            class="btn btn-dark btn-sm">
                        Guardar
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
