<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- Cambio de idioma -->
    <div class="text-end mb-3">

        <a th:if="${servicio.idServicio == null}"
           th:href="@{/servicio/nuevo(lang='es')}"
           class="btn btn-outline-secondary btn-sm">
            Español
        </a>

        <a th:if="${servicio.idServicio == null}"
           th:href="@{/servicio/nuevo(lang='en')}"
           class="btn btn-outline-secondary btn-sm">
            English
        </a>


        <a th:if="${servicio.idServicio != null}"
           th:href="@{/servicio/modificar/{id}(id=${servicio.idServicio},lang='es')}"
           class="btn btn-outline-secondary btn-sm">
            Español
        </a>

        <a th:if="${servicio.idServicio != null}"
           th:href="@{/servicio/modificar/{id}(id=${servicio.idServicio},lang='en')}"
           class="btn btn-outline-secondary btn-sm">
            English
        </a>

    </div>

    <div class="card mx-auto" style="max-width: 600px;">

        <div class="card-header bg-dark text-white">

            <h4 th:text="#{servicio.formulario.titulo}">
                Datos del servicio
            </h4>

        </div>

        <div class="card-body">

            <form th:action="@{/servicio/guardar}"
                  th:object="${servicio}"
                  method="post">

                <!-- ID cuando se modifica -->
                <input type="hidden"
                       th:field="*{idServicio}">

                <!-- Nombre -->
                <div class="mb-3">

                    <label th:text="#{servicio.formulario.nombre}">
                        Nombre
                    </label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           required>

                </div>

                <!-- Descripción -->
                <div class="mb-3">

                    <label th:text="#{servicio.formulario.descripcion}">
                        Descripción
                    </label>

                    <input type="text"
                           th:field="*{descripcion}"
                           class="form-control">

                </div>

                <!-- Duración -->
                <div class="mb-3">

                    <label th:text="#{servicio.formulario.duracion}">
                        Duración en minutos
                    </label>

                    <input type="number"
                           th:field="*{duracion}"
                           class="form-control"
                           required>

                </div>

                <!-- Precio -->
                <div class="mb-3">

                    <label th:text="#{servicio.formulario.precio}">
                        Precio
                    </label>

                    <input type="number"
                           step="0.01"
                           th:field="*{precio}"
                           class="form-control"
                           required>

                </div>

                <!-- Botones -->
                <button type="submit"
                        class="btn btn-dark"
                        th:text="#{servicio.formulario.guardar}">
                    Guardar
                </button>

                <a th:href="@{/servicio/listado}"
                   class="btn btn-secondary"
                   th:text="#{servicio.formulario.regresar}">
                    Regresar
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
