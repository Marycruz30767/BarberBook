<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="text-end mb-3">
        <a th:href="@{/servicio/listado(lang='es')}" class="btn btn-outline-secondary btn-sm">Español</a>
        <a th:href="@{/servicio/listado(lang='en')}" class="btn btn-outline-secondary btn-sm">English</a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2 th:text="#{servicio.titulo}">
            Servicios disponibles
        </h2>

        <a th:href="@{/servicio/nuevo}"
           class="btn btn-dark"
           th:text="#{servicio.nuevo}">
            Nuevo servicio
        </a>

    </div>

    <div class="mb-3">

        <a th:href="@{/reserva/nueva}"
           class="btn btn-outline-dark"
           th:text="#{menu.reservar}">
            Reservar cita
        </a>

        <a th:href="@{/reserva/mis-reservas}"
           class="btn btn-outline-secondary"
           th:text="#{menu.reservas}">
            Mis reservas
        </a>

        <a th:href="@{/usuario/perfil}"
           class="btn btn-outline-secondary"
           th:text="#{menu.perfil}">
            Mi perfil
        </a>

        <a th:href="@{/logout}"
           class="btn btn-outline-danger"
           th:text="#{menu.salir}">
            Cerrar sesión
        </a>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th th:text="#{servicio.nombre}">Nombre</th>
            <th th:text="#{servicio.descripcion}">Descripción</th>
            <th th:text="#{servicio.duracion}">Duración</th>
            <th th:text="#{servicio.precio}">Precio</th>
            <th th:text="#{servicio.opciones}">Opciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="servicio : ${servicios}">

            <td th:text="${servicio.nombre}"></td>

            <td th:text="${servicio.descripcion}"></td>

            <td th:text="${servicio.duracion + ' min'}"></td>

            <td th:text="${'₡' + servicio.precio}"></td>

            <td>
                <a th:href="@{/servicio/modificar/}+${servicio.idServicio}"
                   class="btn btn-sm btn-primary"
                   th:text="#{boton.editar}">
                    Editar
                </a>

                <a th:href="@{/servicio/eliminar/}+${servicio.idServicio}"
                   class="btn btn-sm btn-danger"
                   th:text="#{boton.eliminar}">
                    Eliminar
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
