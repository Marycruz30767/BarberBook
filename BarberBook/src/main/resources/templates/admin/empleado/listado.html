<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Empleados - BarberBook</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Empleados</h2>
        <div>
            <a th:href="@{/admin/empleados/nuevo}" class="btn btn-dark">Registrar empleado</a>
            <a th:href="@{/servicio/listado}" class="btn btn-outline-secondary">Volver</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(empleados)}" class="text-center text-muted py-4">
        No hay empleados registrados todavía.
    </div>

    <table class="table table-bordered table-striped align-middle" th:unless="${#lists.isEmpty(empleados)}">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Especialidad</th>
            <th>Estado</th>
            <th>Opciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empleado : ${empleados}">
            <td th:text="${empleado.usuario.nombre + ' ' + empleado.usuario.apellido}"></td>
            <td th:text="${empleado.usuario.correo}"></td>
            <td th:text="${empleado.usuario.telefono}"></td>
            <td th:text="${empleado.especialidad}"></td>
            <td>
                <span class="badge" th:classappend="${empleado.activo} ? 'bg-success' : 'bg-secondary'"
                      th:text="${empleado.activo} ? 'Activo' : 'Inactivo'">
                </span>
            </td>
            <td>
                <a th:if="${empleado.activo}"
                   th:href="@{/admin/empleados/eliminar/{id}(id=${empleado.idEmpleado})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Desea desactivar a este empleado?');">
                    Desactivar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
