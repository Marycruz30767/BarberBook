<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar empleado - BarberBook</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 550px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Registrar empleado</h4>
        </div>

        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/admin/empleados/guardar}" th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Apellido</label>
                    <input type="text" th:field="*{apellido}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Correo electrónico</label>
                    <input type="email" th:field="*{correo}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>
                    <input type="password" th:field="*{contrasena}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Especialidad</label>
                    <input type="text" name="especialidad" class="form-control"
                           placeholder="Ej: Cortes clásicos y barba" required>
                </div>

                <button type="submit" class="btn btn-dark w-100">Registrar empleado</button>
                <a th:href="@{/admin/empleados}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
