<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Dashboard - BarberBook</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Estadísticas generales</h2>
<div class="mt-4 text-center">

    <a th:href="@{/admin/reportes/citas}"
       class="btn btn-primary">
        Ver reporte de citas
    </a>

</div>
        <div>
            <a th:href="@{/servicio/listado}"
               class="btn btn-secondary">
                Regresar
            </a>

            <a th:href="@{/logout}"
               class="btn btn-outline-danger">
                Cerrar sesión
            </a>
        </div>

    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Total de reservas</h5>
                    <h2 th:text="${totalReservas}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Reservas pendientes</h5>
                    <h2 th:text="${reservasPendientes}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Reservas en proceso</h5>
                    <h2 th:text="${reservasProceso}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Reservas completadas</h5>
                    <h2 th:text="${reservasCompletadas}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Reservas canceladas</h5>
                    <h2 th:text="${reservasCanceladas}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Usuarios registrados</h5>
                    <h2 th:text="${totalUsuarios}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5>Servicios registrados</h5>
                    <h2 th:text="${totalServicios}">0</h2>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
