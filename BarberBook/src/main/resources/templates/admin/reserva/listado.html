<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestionar reservas - BarberBook</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestionar reservas</h2>
        <a th:href="@{/servicio/listado}" class="btn btn-outline-secondary">Volver</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(reservas)}" class="text-center text-muted py-4">
        No hay reservas registradas todavía.
    </div>

    <table class="table table-bordered table-striped align-middle" th:unless="${#lists.isEmpty(reservas)}">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Cliente</th>
            <th>Barbero</th>
            <th>Servicio</th>
            <th>Estado actual</th>
            <th>Cambiar estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reserva : ${reservas}">
            <td th:text="${reserva.fecha}"></td>
            <td th:text="${reserva.hora}"></td>
            <td th:text="${reserva.usuario.nombre + ' ' + reserva.usuario.apellido}"></td>
            <td th:text="${reserva.empleado.usuario.nombre}"></td>
            <td th:text="${reserva.servicio.nombre}"></td>
            <td>
                <span class="badge"
                      th:classappend="${reserva.estado == 'Pendiente'} ? 'bg-warning text-dark' : (${reserva.estado == 'Cancelada'} ? 'bg-secondary' : (${reserva.estado == 'Completada'} ? 'bg-success' : 'bg-info text-dark'))"
                      th:text="${reserva.estado}">
                </span>
            </td>
            <td>
                <form th:action="@{/admin/reservas/estado/{id}(id=${reserva.idReserva})}"
                      method="post" class="d-flex gap-2">
                    <select name="estado" class="form-select form-select-sm">
                        <option value="Pendiente" th:selected="${reserva.estado == 'Pendiente'}">Pendiente</option>
                        <option value="En proceso" th:selected="${reserva.estado == 'En proceso'}">En proceso</option>
                        <option value="Completada" th:selected="${reserva.estado == 'Completada'}">Completada</option>
                        <option value="Cancelada" th:selected="${reserva.estado == 'Cancelada'}">Cancelada</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-dark">Guardar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
