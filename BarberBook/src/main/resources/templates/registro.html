<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BarberBook</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="text-end mb-3">
        <a th:href="@{/registro(lang='es')}" class="btn btn-outline-secondary btn-sm">Español</a>
        <a th:href="@{/registro(lang='en')}" class="btn btn-outline-secondary btn-sm">English</a>
    </div>

    <div class="card mx-auto" style="max-width: 550px;">

        <div class="card-header text-center bg-dark text-white">
            <h4 th:text="#{registro.titulo}">Crear cuenta</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/registro/guardar}" method="post">

                <div class="mb-3">
                    <label th:text="#{registro.nombre}">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label th:text="#{registro.apellido}">Apellido</label>
                    <input type="text" name="apellido" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label th:text="#{registro.correo}">Correo electrónico</label>
                    <input type="email" name="correo" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label th:text="#{registro.telefono}">Teléfono</label>
                    <input type="text" name="telefono" class="form-control">
                </div>

                <div class="mb-3">
                    <label th:text="#{registro.contrasena}">Contraseña</label>
                    <input type="password" name="contrasena" class="form-control" required>
                </div>

                <button type="submit"
                        class="btn btn-dark w-100"
                        th:text="#{registro.boton}">
                    Crear cuenta
                </button>

            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}"
                   th:text="#{registro.login}">
                    Ya tengo cuenta
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
